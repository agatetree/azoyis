<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azoyis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #4E5866;
    --blue: #5C7FB8;
    --gold: #C6913C;
    --card: #F2F4F7;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Outfit', Arial, sans-serif;
    background: #FFFFFF;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }
  .logo {
    width: min(420px, 80vw);
    height: auto;
    animation: rise .6s ease both;
  }
  .tagline {
    margin-top: 14px;
    font-size: 1.05rem;
    letter-spacing: .02em;
    text-align: center;
    animation: rise .6s ease .1s both;
  }
  .tagline .by { color: var(--blue); font-weight: 600; }
  .tagline::after { content: '.'; color: var(--gold); font-weight: 600; }

  .contact-btn {
    margin-top: 32px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--blue);
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    cursor: pointer;
    transition: background .15s ease;
    animation: rise .6s ease .2s both;
  }
  .contact-btn:hover, .contact-btn:focus-visible { background: var(--ink); outline: none; }

  form {
    display: none;
    margin-top: 28px;
    width: min(420px, 100%);
    background: var(--card);
    border-radius: 14px;
    padding: 24px;
  }
  form.open { display: block; animation: rise .3s ease both; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 14px 0 4px; }
  label:first-child { margin-top: 0; }
  input, textarea {
    width: 100%;
    font-family: inherit;
    font-size: .95rem;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid #D8DEE6;
    border-radius: 8px;
    padding: 10px 12px;
  }
  input:focus, textarea:focus { border-color: var(--gold); outline: none; }
  textarea { min-height: 110px; resize: vertical; }
  .send {
    margin-top: 18px;
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--gold);
    border: none;
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    transition: background .15s ease;
  }
  .send:hover, .send:focus-visible { background: var(--ink); outline: none; }
  .thanks {
    display: none;
    margin-top: 28px;
    font-weight: 600;
    color: var(--blue);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo, .tagline, .contact-btn, form.open { animation: none; }
  }
</style>
</head>
<body>

  <img class="logo" src="logo.jpg" alt="Azoyis">
  <p class="tagline">Practical AI tools, built to work &mdash; <span class="by">Built by AzoyIs</span></p>

  <button class="contact-btn" onclick="toggleForm()">Contact Azoyis</button>

  <form id="contactForm" action="https://formsubmit.co/azoyisai@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="New message from azoyis.com">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="https://azoyis.com/?sent=1">

    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Your email</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>

    <button class="send" type="submit">Send</button>
  </form>

  <p class="thanks" id="thanks">Message sent &mdash; we'll get back to you.</p>

<script>
  function toggleForm() {
    document.getElementById('contactForm').classList.toggle('open');
  }
  if (new URLSearchParams(location.search).get('sent') === '1') {
    document.getElementById('thanks').style.display = 'block';
  }
</script>

</body>
</html>
